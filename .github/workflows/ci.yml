name: CI

on:
  push:
    branches: [main, staging]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: enos
          POSTGRES_PASSWORD: password
          POSTGRES_DB: enos
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - name: Run migrations
        env:
          DATABASE_URL: postgres://enos:password@localhost:5432/enos
        run: npm run migrate
      - name: Type check
        run: npx tsc --noEmit
      - name: Run tests
        run: npm test --if-present
